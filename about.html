	<h2 class="text-center mb-4">About Lesotho</h2>
<div class="row">
	<div class="col-md-8 mx-auto">
		<p>Lesotho,officially the kingdom of Lesotho,is a small,mountainous, and landlocked country completely surounded by South Africa.It is known as the Kingdom in the sky because it is the only country in the world where the entire territory lies above 1,000 meters , it offers breathtaking highland scenary.</p>

<h2 class="mt-4">History and Culture</h2>
		<p>The Basotho nation was founded in 1824 by King Moshoeshoe I at Thaba-Bosiu.Basotho culture is very rich and visible in traditional blankets (Seanamarena) ,Basotho hats (Mokorotlo) ,music,and strong respect for community and livestock .Sesotho and English are the official language</p>

			<h4 class="mt-4">Why visit Lesotho</h4>
			<p>Lesotho offers a very different tourism experience from other African countries.No big safari parks but instead:adventure,peace,authentic culture,pony trekking,hiking,waterfalls,and warm hospitality.It is a place where adventure starts where the roads ends.</p>
