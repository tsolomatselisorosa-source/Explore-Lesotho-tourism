.item img:hover{transform:scale(1.05);}
.item p{padding:10px; font-weight:bold; text-align:center; margin:0;}
@media(max-width:800px){.gallery{grid-template-columns:1fr 1fr;}}
@media(max-width:500px){.gallery{grid-template-columns:1fr;}}

<script>
function filterGallery(category){
  let items = document.querySelectorAll('.item');
  items.forEach(item => {
    if(category === 'all' || item.classList.contains(category)){
      item.style.display = 'block';
    } else {
      item.style.display = 'none';
    }
  });
}
</script>
